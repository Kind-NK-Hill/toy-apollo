[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "formalization-engine"
version = "0.2.0"
description = "AI-assisted workflows and verification for the ProbabilityTheory corpus"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
formalize = "formalization_engine.cli.app:main"

[project.optional-dependencies]
retrieval = ["sentence-transformers", "faiss-cpu", "numpy", "tqdm"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["formalization_engine*"]

[tool.setuptools.package-data]
formalization_engine = ["block_id_aliases.json"]
