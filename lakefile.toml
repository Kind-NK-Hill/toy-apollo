name = "ProbabilityTheoryFormalization"
version = "0.2.0"
keywords = ["math"]
defaultTargets = ["ProbabilityTheory"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"
[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl.git"
rev = "v4.31.0"
[[lean_lib]]
name = "ProbabilityTheory"
srcDir = "."
# Build every corpus module and its imports, including modules not imported by
# another task. The manifest guard in CI checks the complete file inventory.
# A single root importing the whole corpus is intentionally not required:
# chapters 1 and 7 retain the documented Partition joint-import boundary.
globs = ["ProbabilityTheory.+"]
