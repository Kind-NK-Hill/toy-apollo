name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enforce Main Repo Hygiene
        run: python tools/check_repo_hygiene.py
      - name: Check Public Snapshot Scope
        run: |
          python tools/prepare_public_snapshot.py
          python tools/check_case_studies.py
          python -m unittest tests.test_repo_hygiene tests.test_prepare_public_snapshot tests.test_case_studies
      - uses: leanprover/lean-action@v1
      - name: Run Python Test Suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compile Public Case Snapshots
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r snapshot; do
            lake env lean "$snapshot"
          done < <(find examples/case-studies -type f -name '*.lean' | sort)
