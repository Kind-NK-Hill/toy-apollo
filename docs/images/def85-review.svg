<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">A compiling definition still needs semantic review</title>
  <desc id="desc">Case def_8_5. The initial interface accepted arbitrary measures. Adding probability-measure guards fixed the owner but callers still needed migration. A fresh review then accepted the owner and its callers. Selected case, not a benchmark.</desc>
  <rect width="1200" height="510" rx="18" fill="#f6f8fa"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d">
    <text x="32" y="43" font-size="25" font-weight="700">Code compiles. Does it mean what we intended?</text>
    <text x="32" y="74" font-size="17" fill="#526174">代码能编译，还要检查含义与调用方 · Case def_8_5</text>
    <rect x="32" y="104" width="548" height="173" rx="10" fill="white" stroke="#d0d7de"/>
    <rect x="620" y="104" width="548" height="173" rx="10" fill="white" stroke="#d0d7de"/>
    <text x="54" y="137" font-size="20" font-weight="700">Before · 修复前</text>
    <text x="642" y="137" font-size="20" font-weight="700">After · 修复后</text>
    <g font-family="Consolas, monospace" font-size="18">
      <text x="54" y="177">(P Q : Measure Ω) : ℝ :=</text>
      <text x="642" y="177">(P Q : Measure Ω)</text>
      <rect x="636" y="189" width="513" height="60" rx="5" fill="#dafbe1"/>
      <text x="642" y="212">[IsProbabilityMeasure P]</text>
      <text x="642" y="238">[IsProbabilityMeasure Q] : ℝ :=</text>
    </g>
    <text x="54" y="217" font-size="17" fill="#a33329">Missing probability-measure conditions</text>
    <text x="54" y="248" font-size="16" fill="#526174">缺少“概率测度”的适用条件</text>
    <path d="M589 190h20m-7-7 7 7-7 7" fill="none" stroke="#6e7781" stroke-width="2"/>
    <rect x="32" y="307" width="354" height="139" rx="10" fill="#fff1ef" stroke="#eeb5ad"/>
    <rect x="423" y="307" width="354" height="139" rx="10" fill="#fff8e6" stroke="#e7d398"/>
    <rect x="814" y="307" width="354" height="139" rx="10" fill="#eaf7ef" stroke="#a8cfb8"/>
    <text x="52" y="337" font-size="18" font-weight="700">1 · Missing conditions</text>
    <text x="52" y="365" font-size="16">Build passes; review fails.</text>
    <text x="52" y="399" font-size="16">能编译，审查发现条件缺失</text>
    <text x="52" y="426" font-size="14" fill="#526174">Timeline: review 1</text>
    <text x="443" y="337" font-size="18" font-weight="700">2 · Callers still need repair</text>
    <text x="443" y="365" font-size="16">Owner fixed; review fails again.</text>
    <text x="443" y="399" font-size="16">补齐条件后，继续修复下游调用</text>
    <text x="443" y="426" font-size="14" fill="#526174">Timeline: review 2</text>
    <text x="834" y="337" font-size="18" font-weight="700">3 · Fresh review passes</text>
    <text x="834" y="365" font-size="16">Owner and callers checked together.</text>
    <text x="834" y="399" font-size="16">重新绑定版本并检查，审查通过</text>
    <text x="834" y="426" font-size="14" fill="#526174">Timeline: review 4; confirmed in 5</text>
    <path d="M394 374h20m-7-7 7 7-7 7M786 374h20m-7-7 7 7-7 7" fill="none" stroke="#6e7781" stroke-width="2"/>
    <text x="32" y="480" font-size="15" fill="#526174">Source: public code excerpts + retained review timeline · 精选案例，不代表准确率</text>
  </g>
</svg>
